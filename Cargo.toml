[package]
name = "boobies"
version = "0.1.0"
edition = "2024"
description = "A deliberately silly but serious Linux package manager."
license = "MIT"
repository = "https://example.com/boobies"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
url = "2"
walkdir = "2"
